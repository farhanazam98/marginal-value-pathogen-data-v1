# Per-protein pipeline config. Selected by the PROTEIN_CONFIG env var
# (default: config/spike.yaml). Steps 00/01 read the query and threshold;
# steps 05/06 score every assay listed here against the one PSSM built for
# this protein.
name: AAV2_Capsid
query_fasta: data/proteins/aav2_capsid.fasta
bitscore_per_residue: 0.1   # baseline value; the final round sweeps EVEREST's full grid {0.01-0.5}
assays:
  - id: sinai_fitness
    csv: data/dms/AAV2_CAPSD_Sinai_dms.csv
    label: Sinai 2021 capsid fitness
